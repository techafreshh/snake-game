name: CI

on: [push, pull_request]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check js/*.js
        run: |
          files=(js/*.js)
          if [ ! -e "${files[0]}" ]; then
            echo "No js/*.js files found"
            exit 1
          fi
          for f in js/*.js; do
            echo "Checking $f"
            node --check "$f" || exit 1
          done
